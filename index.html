<style>
:root{--bg:#0B1426;--card:#111D35;--card2:#16244A;--line:#22325A;--tx:#E8EFFA;--mu:#8C9DBC;--ok:#00FFA3;--cy:#00F0FF;--am:#FFC857;--gr:#6B7DA3;--rose:#FF8FAB;--side:270px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Nunito,system-ui,sans-serif;font-size:15px;overscroll-behavior-y:none}
button{font-family:inherit}
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 42%,#1B2C5A,#0B1426 65%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .45s,visibility .45s}
#splash.out{opacity:0;visibility:hidden}
#splash img{width:132px;height:132px;border-radius:32px;box-shadow:0 18px 60px rgba(255,143,171,.35);animation:pop 1s cubic-bezier(.2,1.4,.4,1) both,float 2.4s 1s ease-in-out infinite}
#splash h1{margin:0;font-size:34px;font-weight:900;letter-spacing:.5px;animation:fade .7s .35s both}
#splash h1 span{color:var(--rose)}
#splash p{margin:-10px 0 0;color:var(--mu);font-size:14px;animation:fade .7s .55s both}
#splash .ld{width:150px;height:5px;border-radius:9px;background:var(--card2);overflow:hidden;animation:fade .5s .6s both}
#splash .ld i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--ok),var(--cy));animation:load 2.6s cubic-bezier(.5,0,.3,1) forwards}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@keyframes load{to{width:100%}}
#root{max-width:820px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}
/* barra superior */
.topb{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.topb .ttl{display:flex;align-items:center;gap:10px;font-size:27px;font-weight:900;flex:1;min-width:0;white-space:nowrap}
.topb .ttl img{width:40px;height:40px;border-radius:11px}.topb .ttl span{color:var(--rose)}
.ib{width:38px;height:38px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:17px;display:grid;place-items:center;cursor:pointer}
.ib:hover{background:var(--card2)}
.ham{display:grid}
.ttl .ld{font-style:normal}@media(max-width:480px){.ttl .ld{display:none}}
@media(max-width:480px){.inst{width:38px;padding:0;font-size:16px}.inst em{display:none}.topb{gap:6px}}
.inst em{font-style:normal}
.inst{flex:none;height:38px;border:0;border-radius:12px;padding:0 12px;background:var(--card2);color:var(--mu);font-weight:900;font-size:13px;cursor:pointer;white-space:nowrap}
.inst.ready{background:var(--rose);color:#3A0D1A;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,143,171,.25)}}
.chipst{font-size:11px;font-weight:800;color:var(--mu);white-space:nowrap}
.chipst.ok{color:var(--ok)}.chipst.off{color:var(--am)}
/* hero */
.hero{background:linear-gradient(135deg,#15275A,#0F1B36 70%);border:1px solid var(--line);border-radius:24px;padding:16px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;left:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,143,171,.22),transparent 70%);pointer-events:none}
.hs{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:6px;position:relative;z-index:1}
.hs>div{padding:4px 6px}.hs>div+div{border-left:1px solid var(--line)}
.hs b{display:block;font-size:34px;line-height:1.05;font-weight:900;letter-spacing:-.5px}
.hs span{display:block;font-size:12px;color:var(--mu);font-weight:700;margin-top:3px}
.hs input{background:transparent;border:0;color:var(--mu);font:inherit;font-size:12px;font-weight:700;padding:0;color-scheme:dark;width:100%;cursor:pointer}
.h2{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.preg{flex:1;min-width:0;cursor:pointer}
.preg .lbl{font-size:12px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:1px}.preg .lbl em{font-style:normal;opacity:.6;margin-left:4px}
.preg>b{display:block;font-size:44px;line-height:1.05;font-weight:900;color:var(--rose);letter-spacing:-.5px;margin:4px 0 8px}.preg>b small{font-size:.5em;margin-right:2px}
.ptl{position:relative;height:8px;border-radius:9px;background:var(--card2);margin-bottom:8px}.ptl i{position:absolute;inset:0 auto 0 0;border-radius:9px;background:linear-gradient(90deg,#FFD3DE,var(--rose))}.ptl s{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--rose)}
.lbl2{font-size:13px;color:var(--mu);font-weight:700}
.pct{display:flex;flex-direction:column;align-items:center;flex:none}.pct span{font-size:12px;font-weight:800;color:var(--mu);margin-top:-2px}
.pleg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px;color:var(--mu);font-weight:700;position:relative;z-index:1}.pleg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}.pleg b{color:var(--tx)}
.pbar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:14px;display:flex;position:relative;z-index:1}.pbar i{display:block;height:100%}
/* nav: menú desplegable en todas las pantallas */
nav.tabs{position:fixed;top:0;bottom:0;left:0;width:min(82vw,var(--side));z-index:45;display:flex;flex-direction:column;gap:6px;padding:calc(22px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom));background:#0A1222;border-right:1px solid var(--line);transform:translateX(-105%);transition:transform .25s ease;box-shadow:20px 0 60px rgba(0,0,0,.45)}
nav.tabs.open{transform:none}
.scrim{position:fixed;inset:0;z-index:44;background:rgba(3,8,20,.55);opacity:0;pointer-events:none;transition:.25s}
.scrim.open{opacity:1;pointer-events:auto}
nav .brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px;font-size:17px;line-height:1.15;font-weight:900}
nav .brand img{width:44px;height:44px;border-radius:12px}nav .brand span{color:var(--rose)}
nav .tb{border:0;background:transparent;color:var(--mu);font-weight:800;cursor:pointer;display:flex;align-items:center;gap:12px;font-size:16px;padding:13px 14px;border-radius:14px;text-align:left}
nav .tb em{font-style:normal;font-size:21px}nav .tb.on{background:var(--card2);color:var(--tx)}nav .tb:hover{background:var(--card)}
nav .foot{margin-top:auto;font-size:13px;color:var(--mu)}
nav .foot .btn{width:100%;margin-top:8px;font-size:14px;text-align:left}
nav .foot #st2{padding:0 6px 4px;font-weight:800}nav .foot #st2.ok{color:var(--ok)}nav .foot #st2.off{color:var(--am)}
.home .card{max-width:640px;margin:0 auto 14px}
@media(min-width:1024px){.home .card{display:block;max-width:none;padding:24px 30px}.home .how{flex-direction:row;align-items:center;gap:40px}.home .how>div{flex:1}}
#root{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
#body{flex:1 1 auto;display:flex;flex-direction:column}
#root.t-resumen .hero{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:250px}
#root.t-resumen #body{flex:1.4 1 auto}
#root.t-resumen .preg>b{font-size:58px}
#root.t-resumen .h2{gap:10px}
#root.t-resumen .bento,#root.t-resumen .kpis{flex:none}
.cv{flex:1 1 auto;display:flex;flex-direction:column;margin-bottom:0}.cv .cvw{flex:1;justify-content:center}
.cvl>div{padding:6px 0;font-size:15px}.cvl{max-width:460px}
@media(min-width:1024px){#root.t-resumen .hero{flex:0 0 auto;min-height:0}#root.t-resumen .preg>b{font-size:64px}}
.cgrid{flex:1 0 auto;grid-auto-rows:minmax(min-content,1fr)}
.cgrid .grp.closed{display:flex;flex-direction:column;justify-content:center}
.cgrid.one{grid-template-columns:1fr!important}
.cgrid.one .grp.closed .gh .n{font-size:15px}
.secth{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.secth .sect{margin:0}.secth .btn{padding:9px 14px}
.sect b{color:var(--tx);margin-left:6px;letter-spacing:.5px}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cgrid .grp{margin:0;position:relative}
.cgrid .grp.closed .gh{padding:12px 12px 14px;gap:8px}
.cgrid .grp.closed .gh .n{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cgrid .grp.closed .gh .e{font-size:18px}
.cgrid .grp.closed .chev{display:none}
.cgrid .grp.closed .mini{position:absolute;left:12px;right:12px;bottom:6px;width:auto;height:3px}
.cgrid .grp:not(.closed){grid-column:1/-1}
@media(min-width:700px){.cgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.bt{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;cursor:pointer;position:relative;overflow:hidden}
.bt:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.bt span{display:block;font-size:12px;font-weight:800;color:var(--mu)}.bt b{display:block;font-size:28px;font-weight:900;color:var(--c);line-height:1.1;margin-top:2px}.bt small{font-size:11px;color:var(--mu);font-weight:700}
.btbar{height:5px;border-radius:5px;background:var(--card2);margin-top:6px;overflow:hidden}.btbar i{display:block;height:100%;background:var(--c)}
.cv{padding:14px 16px}.cv h3{margin-bottom:6px}
.cvw{display:flex;align-items:center;gap:16px}
.cvl{flex:1;min-width:0}.cvl>div{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:3px 0}.cvl i{width:9px;height:9px;border-radius:3px}.cvl b{margin-left:auto;font-weight:900}
.cvt{border-top:1px solid var(--line);margin-top:6px;padding-top:7px!important;color:var(--mu);font-size:12px!important}.cvt b{color:var(--tx)}
.sect{font-size:13px;font-weight:900;color:var(--mu);text-transform:uppercase;letter-spacing:1.2px;margin:2px 2px 10px}
#body{margin-top:14px}
/* filtros + buscador */
.fbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mu);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:50%}
.chip.on{background:var(--tx);color:#0B1426;border-color:var(--tx)}
.srch{display:flex;gap:6px;align-items:center;flex:0 1 250px;margin-left:auto}
.srch input{width:100%;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:9px 12px;font:inherit;font-size:14px}
.srch .btn{padding:9px 13px;border-radius:12px;white-space:nowrap}
@media(max-width:600px){.srch{flex:1 1 100%}.chipst{font-size:0}.chipst:before{content:'●';font-size:13px}}
/* tarjetas KPI */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;cursor:pointer;overflow:hidden;transition:.15s}
.kc:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.kc.on{background:var(--card2);border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
.kc .kn{font-size:34px;font-weight:900;line-height:1;color:var(--c);letter-spacing:-.5px}
.kc .kn small{font-size:18px;color:var(--mu);font-weight:800}
.kc .kl{font-size:13px;font-weight:800;margin-top:8px}
.kc .ks{font-size:13px;font-weight:800;color:var(--c);margin-top:2px;opacity:.9}
.kc svg{position:absolute;right:10px;top:12px}
@media(max-width:700px){.kpis{gap:6px}.kc{padding:10px 6px 9px;border-radius:14px;text-align:center}.kc svg{display:none}.kc .kn{font-size:26px}.kc .kn small{font-size:13px}.kc .kl{font-size:11px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kc .ks{font-size:11px;white-space:nowrap}.kc:after{content:"";position:absolute;left:8px;right:8px;bottom:5px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--c) calc(var(--p)*100%),#22325A 0)}}
/* listas */
.btn{background:var(--cy);color:#04202A;border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer}
.btn.ghost{background:var(--card2);color:var(--tx)}.btn.danger{background:#FF5C7A;color:#fff}.btn.rose{background:var(--rose);color:#3A0D1A}
.btn:disabled{opacity:.5}
.cols{display:block}
.grp{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden;break-inside:avoid}
.gh{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.gh .e{font-size:20px}.gh .n{flex:1;font-weight:800}.gh .c{font-size:13px;color:var(--mu);font-weight:700}
.mini{width:60px;height:6px;background:var(--card2);border-radius:9px;overflow:hidden;display:flex}.mini i{height:100%}
.chev{color:var(--mu);transition:.2s}.grp.closed .chev{transform:rotate(-90deg)}.grp.closed .items{display:none}
.it{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.it:hover{background:#142347}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--gr);flex:none;display:grid;place-items:center;font-size:14px;font-weight:900;color:#062;transition:.15s}
.ck.on{background:var(--ok);border-color:var(--ok)}.ck.pk.on{background:var(--rose);border-color:var(--rose);color:#3A0D1A}
.it .t{flex:1;min-width:0}.it .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .t small{color:var(--mu);font-size:12px}
.it.done .t div{color:var(--mu);text-decoration:line-through;text-decoration-color:rgba(0,255,163,.5)}
.pill{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pr{font-weight:700;font-size:13px;min-width:56px;text-align:right;white-space:nowrap}
.qty{font-size:11px;background:var(--card2);border-radius:6px;padding:1px 5px;margin-left:4px;color:var(--mu)}
.x{color:var(--mu);border:0;background:none;font-size:18px;cursor:pointer;padding:0 4px;opacity:.5}
.add{display:flex;gap:8px;padding:10px 14px}
.add input,.add select{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:8px;font:inherit;min-width:0}
.add input{flex:1}
.empty{text-align:center;color:var(--mu);padding:30px}
/* resumen */
.rgrid{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;break-inside:avoid}
.card h3{margin:0 0 14px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 small{margin-left:auto;color:var(--mu);font-weight:700;font-size:12px}
.how{display:flex;flex-direction:column;align-items:center;gap:14px}
.srow{width:100%;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px 12px;padding:9px 12px;border-radius:14px;background:var(--card2)}
.srow+.srow{margin-top:8px}
.srow .lb{font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}.srow .lb i{width:10px;height:10px;border-radius:3px}
.srow .vv{text-align:right;color:var(--c);font-weight:900;font-size:17px;white-space:nowrap}.srow .vv small{font-size:13px;opacity:.8;margin-left:8px}
.srow .tr{grid-column:1/4;height:6px;background:#0F1A34;border-radius:9px;overflow:hidden}.srow .tr i{display:block;height:100%;background:var(--c);border-radius:9px}
.money{text-align:center;padding:10px 0 6px}
.money b{display:block;font-size:46px;font-weight:900;letter-spacing:-1px;background:linear-gradient(90deg,var(--ok),var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
.money span{color:var(--mu);font-size:13px;font-weight:700}
.crow{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.crow .bar{height:12px;background:var(--card2);border-radius:9px;overflow:hidden;display:flex}.crow .bar i{height:100%}
.crow .r{text-align:right;color:var(--mu);white-space:nowrap;font-weight:700}
.pace{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.pace .pl{flex:1;min-width:190px}

.pace .pr2 b{font-size:20px;font-weight:900}
.verdict{margin-top:12px;padding:10px 12px;border-radius:12px;font-weight:800;font-size:14px}
/* hojas */
.ov{position:fixed;inset:0;background:rgba(3,8,20,.65);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom));animation:up .2s}

.acts{display:flex;gap:8px;margin-top:16px}.acts .btn{flex:1}
.menu .btn{width:100%;margin-top:8px;text-align:left}
.note{font-size:12px;color:var(--mu);margin-top:8px;line-height:1.5}
/* acceso */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate .box{width:100%;max-width:380px;text-align:center}
.gate img{width:96px;height:96px;border-radius:24px;box-shadow:0 14px 40px rgba(255,143,171,.3)}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:50;font-size:14px;animation:up .2s}
/* ===== ordenador ===== */
@media(min-width:1024px){
 html,body{font-size:16px}
 #root{max-width:1400px;padding:22px 36px 40px}
 .topb{margin-bottom:16px}.topb .ttl{font-size:34px}.topb .ttl img{width:40px;height:40px}
 .hero{padding:24px 28px}

}

</style></head><body>
<div id="splash"><img src="logo-j.svg" alt=""><h1>Lista de <span>Jimena</span></h1><p>Preparándolo todo para su llegada</p><div class="ld"><i></i></div></div>
<div id="root"></div>
<script>
const OWNER='pietor12-spec',APP_REPO='lista-jimena',DATA_REPO='lista-jimena-data';
const API=window.LJ_API||'https://api.github.com';
const COL={'Comprado':'#00FFA3','Pedido':'#00F0FF','Visto':'#FFC857','No visto':'#7F8FB3'};
const ORDER=['Comprado','Pedido','Visto','No visto'];
const EMO={'Higiene':'🛁','Alimentación':'🍼','Organización':'🧺','Ropa':'👶','Postparto':'🌸','Paseo':'🚼','Juego':'🧸','Habitación':'🛏️','Hospital':'🏥','Limpieza':'🧼','Seguridad':'🛡️','Viajes':'✈️','Tecnología':'📡','Documentación':'📄','Aseo':'🧴','Salida':'🚗','Acompañante':'🧑','Mamá (ropa)':'👘','Mamá (posparto)':'🌸','Mamá (lactancia)':'🤱','Bebé (pañal)':'🧷','Bebé (piel)':'🧴','Bebé (higiene)':'💧','Bebé (ropa)':'👶','Bebé (abrigo)':'🧣','Bebé (baño)':'🛁','Extras':'✨'};
const WHO=['Mamá','Bebé','Ambos','Acompañante'];
const K={tok:'lj-token',data:'lj-data',ui:'lj-ui',pend:'lj-pending'};
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let S=null,token=LS.get(K.tok),sha=null,pending=LS.get(K.pend)=='1',busy=false,again=false,stS='',timer=null,deferRender=false,view='app';
let ui={tab:(location.hash||'#compras').slice(1),filter:null,q:'',open:{},who:'Todos',sheet:null,del:false,menu:false,drawer:false};
try{Object.assign(ui,JSON.parse(LS.get(K.ui)||'{}'),{sheet:null,del:false,menu:false,q:'',open:{},drawer:false})}catch(e){}
ui.tab='resumen';ui.filter=null;ui.who='Todos';ui.open={};
try{S=JSON.parse(LS.get(K.data)||'null')}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>(n||0).toLocaleString('es-ES',{minimumFractionDigits:0,maximumFractionDigits:2,useGrouping:'always'})+' €';
const emo=c=>EMO[c]||'✨';
const live=a=>a.filter(i=>!i.del);
const desk=()=>matchMedia('(min-width:1024px)').matches;

/* ---------- utilidades ---------- */
const b64e=s=>{const b=new TextEncoder().encode(s);let r='';for(let i=0;i<b.length;i+=8192)r+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(r)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const ab2b=a=>btoa(String.fromCharCode(...new Uint8Array(a)));const b2ab=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function kdf(pw,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(tok,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const k=await kdf(pw,salt);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(tok));return {v:1,salt:ab2b(salt),iv:ab2b(iv),ct:ab2b(ct)}}
async function unseal(v,pw){const k=await kdf(pw,b2ab(v.salt));return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b2ab(v.iv)},k,b2ab(v.ct)))}
function gh(path,opt={},tk=token){return fetch(API+path,{...opt,cache:'no-store',headers:{Authorization:'Bearer '+tk,Accept:'application/vnd.github+json',...(opt.headers||{})}})}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

/* ---------- sincronización ---------- */
function mergeList(r=[],l=[]){const m=new Map(r.map(x=>[x.id,x]));l.forEach(x=>{const y=m.get(x.id);if(!y||(x.u||0)>(y.u||0))m.set(x.id,x)});return [...m.values()]}
function merge(r,l){if(!l)return r;return {v:1,due:(l.dueU||0)>(r.dueU||0)?l.due:r.due,dueU:Math.max(l.dueU||0,r.dueU||0),items:mergeList(r.items,l.items),bag:mergeList(r.bag,l.bag)}}
const dataPath=`/repos/${OWNER}/${DATA_REPO}/contents/data.json`;
async function pull(){const r=await gh(dataPath+'?t='+Date.now());if(r.status==404){sha=null;return null}if(!r.ok)throw r.status;const j=await r.json();sha=j.sha;return JSON.parse(b64d(j.content))}
function saveLocal(){LS.set(K.data,JSON.stringify(S));LS.set(K.pend,pending?'1':'0')}
async function sync(){if(!token)return;if(busy){again=true;return}busy=true;setSt('sync');
 try{for(let k=0;k<4;k++){const remote=await pull();const merged=remote?merge(remote,S):S;const js=JSON.stringify(merged);
   const changedLocal=js!==JSON.stringify(S);S=merged;saveLocal();if(changedLocal)safeRender();
   if(!pending&&remote){break}
   if(remote&&js===JSON.stringify(remote)){pending=false;break}
   const r=await gh(dataPath,{method:'PUT',body:JSON.stringify({message:'Lista de Jimena: cambios',content:b64e(JSON.stringify(S,null,1)),...(sha?{sha}:{})})});
   if(r.ok){sha=(await r.json()).content.sha;pending=false;break}
   if(r.status==409||r.status==422)continue;throw r.status}
  saveLocal();setSt(pending?'off':'ok')}
 catch(e){setSt(e==401||e==403?'auth':'off');if(e==401){LS.del(K.tok);token=null;}}
 busy=false;if(again){again=false;sync()}}
function persist(o){if(o)o.u=Date.now();pending=true;saveLocal();setSt('sync');clearTimeout(timer);timer=setTimeout(sync,900)}
function setSt(s){stS=s;const el=$('#st'),el2=$('#st2');const t={ok:'☁ Sincronizado',sync:'Guardando…',off:'⚠ Sin conexión',auth:'⚠ Hay que volver a entrar','':'…'}[s];
 [el,el2].forEach(x=>{if(x){x.textContent=t;x.className=(x.id=='st'?'chipst ':'')+(s=='ok'?'ok':s=='off'||s=='auth'?'off':'')}})}
function safeRender(){if(ui.sheet||document.activeElement&&['INPUT','SELECT'].includes(document.activeElement.tagName)&&document.activeElement.id!='q'){deferRender=true;return}
 const q=document.activeElement&&document.activeElement.id=='q';render();if(q){const i=$('#q');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}}
setInterval(()=>{if(document.visibilityState=='visible'&&token&&!busy)sync()},20000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible'&&token)sync();else if(pending&&token){clearTimeout(timer);sync()}});
window.addEventListener('online',()=>token&&sync());

/* ---------- pantallas de acceso ---------- */
async function getVault(){try{const r=await fetch('vault.json?t='+Date.now(),{cache:'no-store'});if(r.ok)return await r.json()}catch(e){}
 try{const r=await fetch(`${API}/repos/${OWNER}/${APP_REPO}/contents/vault.json?t=${Date.now()}`,{cache:'no-store'});if(r.ok)return JSON.parse(b64d((await r.json()).content))}catch(e){}return null}
async function gate(mode){view=mode;const V=mode=='unlock'?await getVault():null;if(mode=='unlock'&&!V)mode=view='setup';
 $('#root').innerHTML=`<div class="gate"><div class="box"><img src="logo-j.svg" alt=""><h2>Lista de <span>Jimena</span></h2>
 ${mode=='unlock'?`<div class="note">Escribe la contraseña de la familia</div><input id="pw" type="password" autocomplete="current-password" placeholder="Contraseña"><button class="btn rose" id="go">Entrar</button>`
 :`<div class="note">Primera configuración. El token de GitHub necesita <b>Contents: Read and write</b> en lista-jimena y lista-jimena-data.</div>
 <input id="tk" type="password" placeholder="Token de GitHub" autocomplete="off"><input id="p1" type="password" placeholder="Contraseña nueva (mín. 8)" autocomplete="new-password"><input id="p2" type="password" placeholder="Repite la contraseña" autocomplete="new-password"><button class="btn rose" id="go">Guardar y entrar</button>`}
 <div class="err" id="err"></div>${standalone()?'':'<a data-a="install" style="display:block">⬇ Instalar la app en este móvil</a>'}${mode=='unlock'?'<a id="re">Configurar de nuevo</a>':(V!==null?'':'')}</div></div>`;
 const err=t=>$('#err').textContent=t;
 if($('#re'))$('#re').onclick=()=>gate('setup');
 const go=async()=>{const b=$('#go');b.disabled=true;err('');
  try{if(mode=='unlock'){const pw=$('#pw').value;if(!pw)throw 'Escribe la contraseña';let tk;try{tk=await unseal(V,pw)}catch(e){throw 'Contraseña incorrecta'}await enter(tk)}
  else{const tk=$('#tk').value.trim(),p1=$('#p1').value,p2=$('#p2').value;if(!tk)throw 'Falta el token';if(!/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(tk))throw 'Eso no parece un token. Debe empezar por github_pat_ y no llevar espacios.';if(p1.length<8)throw 'La contraseña necesita 8 caracteres o más';if(p1!==p2)throw 'Las contraseñas no coinciden';
   const t=await gh(`/repos/${OWNER}/${DATA_REPO}`,{},tk);if(t.status==401)throw 'GitHub no reconoce ese token. Cópialo con el botón de copiar, junto al token.';if(!t.ok)throw 'El token no tiene acceso a lista-jimena-data ('+t.status+'). Revisa los repos elegidos.';
   const vault=await seal(tk,p1);const vp=`/repos/${OWNER}/${APP_REPO}/contents/vault.json`;const old=await gh(vp,{},tk);const osha=old.ok?(await old.json()).sha:null;
   const w=await gh(vp,{method:'PUT',body:JSON.stringify({message:'Lista de Jimena: acceso',content:b64e(JSON.stringify(vault)),...(osha?{sha:osha}:{})})},tk);if(!w.ok)throw 'El token no puede escribir en lista-jimena ('+w.status+')';
   await enter(tk)}}catch(e){err(typeof e=='string'?e:'Algo falló. Revisa la conexión.');b.disabled=false}};
 $('#go').onclick=go;$('#root').querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key=='Enter')go()});}
async function enter(tk){const prev=token;token=tk;try{const r=await pull();S=merge(r||{items:[],bag:[]},pending?S:null);if(!r&&!S)throw 0;LS.set(K.tok,tk);saveLocal();view='app';render();setSt('ok');if(pending)sync()}catch(e){token=prev;throw e==401?'El token no vale o ha caducado':'No pude leer la lista ('+e+')'}}
function lock(){LS.del(K.tok);LS.del(K.data);LS.del(K.pend);token=null;S=null;pending=false;ui.menu=false;gate('unlock')}

/* ---------- vistas ---------- */
const WCOL={'Mamá':'#FF8FAB','Bebé':'#00F0FF','Ambos':'#FFC857','Acompañante':'#00FFA3'};
const fsOk=()=>!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
function stats(){const s={n:0,eur:0,by:{}};ORDER.forEach(k=>s.by[k]={n:0,eur:0});live(S.items).forEach(i=>{s.n++;s.eur+=+i.price||0;const b=s.by[i.status]||s.by['No visto'];b.n++;b.eur+=+i.price||0});return s}
function cats(list){const m={};list.forEach(i=>(m[i.cat]=m[i.cat]||[]).push(i));return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0],'es'))}
function segBar(cnt,total){return ORDER.map(k=>cnt[k]?`<i style="width:${cnt[k]/total*100}%;background:${COL[k]}"></i>`:'').join('')}
function donut(parts,center,sub,size=150){const r=54,C=2*Math.PI*r,tot=parts.reduce((a,p)=>a+p.v,0)||1;let off=0;
 const segs=parts.map(p=>{const len=p.v/tot*C;const s=`<circle r="${r}" cx="70" cy="70" fill="none" stroke="${p.c}" stroke-width="16" stroke-dasharray="${Math.max(len-2,0)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;return s}).join('');
 return `<svg width="${size}" height="${size}" viewBox="0 0 140 140"><circle r="${r}" cx="70" cy="70" fill="none" stroke="#16244A" stroke-width="16"/>${segs}<text x="70" y="${sub?72:78}" text-anchor="middle" fill="#E8EFFA" font-size="${sub?28:26}" font-weight="900" font-family="Nunito,system-ui,sans-serif">${center}</text>${sub?`<text x="70" y="90" text-anchor="middle" fill="#8C9DBC" font-size="11" font-weight="700" font-family="Nunito,system-ui,sans-serif">${sub}</text>`:''}</svg>`}
function ring(p,c,s=34){const r=12,C=2*Math.PI*r;return `<svg width="${s}" height="${s}" viewBox="0 0 30 30"><circle r="${r}" cx="15" cy="15" fill="none" stroke="#22325A" stroke-width="4"/><circle r="${r}" cx="15" cy="15" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${Math.max(p*C,.01)} ${C}" transform="rotate(-90 15 15)"/></svg>`}
function kc(o){return `<div class="kc ${o.on?'on':''}" style="--c:${o.c};--p:${o.p||0}" data-a="${o.a}" data-v="${o.v}">${ring(o.p,o.c,desk()?42:32)}<div class="kn">${o.n}</div><div class="kl">${o.l}</div><div class="ks">${o.s}</div></div>`}
function chip(label,v,on,c){return `<button class="chip ${on?'on':''}" data-a="${ui.tab=='mochila'?'who':'filter'}" data-v="${v}">${c?`<i style="background:${c}"></i>`:''}${label}</button>`}
const eurS=n=>Math.round(n||0).toLocaleString('es-ES',{useGrouping:'always'})+'<small style="font-size:.55em;margin-left:2px">€</small>';
function keepUi(){LS.set(K.ui,JSON.stringify({tab:ui.tab,filter:ui.filter,who:ui.who}))}
function isOpen(k,forced){return forced||!!ui.open[k]}

function heroHtml(st,pct,due,days,ga,gw,gd){return `<div class="hero"><div class="h2">
  <div class="preg" data-a="editpreg" title="Editar semanas">
   <span class="lbl">🤰 Embarazo <em>✎</em></span>
   <b>${days>0?`${gw}<small>s</small> ${gd}<small>d</small>`:'¡Ya está aquí!'}</b>
   <div class="ptl"><i style="width:${Math.min(100,ga/280*100)}%"></i><s style="left:${Math.min(100,ga/280*100)}%"></s></div>
   <span class="lbl2">Faltan <b style="display:inline;font-size:inherit;color:var(--tx)">${Math.max(0,days)} días</b> · ${due.toLocaleDateString('es-ES',{day:'numeric',month:'long'})}</span>
  </div>
  <div class="pct">${(()=>{const r=44,C=2*Math.PI*r,sz=desk()?150:124;return `<svg width="${sz}" height="${sz}" viewBox="0 0 100 100"><circle r="${r}" cx="50" cy="50" fill="none" stroke="#16244A" stroke-width="9"/><circle r="${r}" cx="50" cy="50" fill="none" stroke="#00FFA3" stroke-width="9" stroke-linecap="round" stroke-dasharray="${Math.max(pct/100*C,.01)} ${C}" transform="rotate(-90 50 50)"/><text x="50" y="55" text-anchor="middle" fill="#00FFA3" font-size="24" font-weight="900" font-family="Nunito,system-ui,sans-serif">${pct}%</text></svg>`})()}<span>comprado</span></div></div>
  <div class="pbar">${segBar(Object.fromEntries(ORDER.map(k=>[k,st.by[k].n])),st.n||1)}</div>
  <div class="pleg">${ORDER.map(k=>`<span><i style="background:${COL[k]}"></i>${k} <b>${st.by[k].n}</b></span>`).join('')}</div></div>`}
function render(){if(view!='app'||!S)return;deferRender=false;keepUi();const st=stats(),bought=st.by.Comprado.n,pct=Math.round(bought/st.n*100)||0;
 const due=new Date((S.due||'2027-02-23')+'T12:00:00'),days=Math.ceil((due-new Date())/864e5),ga=Math.max(0,280-days),gw=Math.floor(ga/7),gd=ga%7;
 $('#root').className='t-'+ui.tab;$('#root').innerHTML=`<div class="topb"><button class="ib ham" data-a="drawer" title="Menú">☰</button>
 <div class="ttl"><img src="logo-j.svg" alt=""><div><em class="ld">Lista de </em><span>Jimena</span></div></div>
 <span class="chipst" id="st"></span>${installBtn()}${fsOk()?`<button class="ib" data-a="fs" title="Pantalla completa">⛶</button>`:''}<button class="ib" data-a="menu" title="Ajustes">⚙︎</button></div>
 ${ui.tab=='resumen'?heroHtml(st,pct,due,days,ga,gw,gd):''}
 <nav class="tabs ${ui.drawer?'open':''}"><div class="brand"><img src="logo-j.svg" alt=""><div>Lista de<br><span>Jimena</span></div></div>
 ${[['resumen','🏠','Resumen'],['compras','🛒','Compras'],['mochila','🎒','Mochila'],['analisis','📈','Análisis']].map(([k,i,l])=>`<button class="tb ${ui.tab==k?'on':''}" data-a="tab" data-v="${k}"><em>${i}</em>${l}</button>`).join('')}
 <div class="foot"><div id="st2"></div>${fsOk()?'<button class="btn ghost" data-a="fs">⛶ Pantalla completa</button>':''}<button class="btn ghost" data-a="share">🔗 Compartir</button><button class="btn ghost" data-a="lock">🔒 Bloquear este equipo</button></div></nav>
 <div class="scrim ${ui.drawer?'open':''}" data-a="drawer"></div>
 <div id="body"></div>${ui.sheet?sheetHtml():''}${ui.menu?menuHtml():''}`;
 ({resumen,compras,mochila,analisis})[ui.tab]();setSt(stS);}

function compras(){const st=stats(),f=ui.filter;
 $('#body').innerHTML=`<div class="secth"><div class="sect">🛒 Compras <b>${st.by.Comprado.n}/${st.n}</b></div></div><div class="fbar"><div class="srch" style="flex:1 1 auto;max-width:520px;margin-left:0"><input id="q" placeholder="🔍 Buscar${desk()?' ( / )':''}" value="${esc(ui.q)}"><button class="btn" data-a="new">+ Añadir</button></div></div>
 <div class="kpis">${kc({c:'#E8EFFA',n:st.n,l:'Todo',s:eur(Math.round(st.eur)),p:st.by.Comprado.n/st.n,on:!f,a:'filter',v:''})}
 ${ORDER.map(k=>kc({c:COL[k],n:st.by[k].n,l:k,s:st.by[k].eur?eur(Math.round(st.by[k].eur)):'—',p:st.by[k].n/st.n,on:f==k,a:'filter',v:k})).join('')}</div>
 <div id="list" class="cgrid"></div>`;list()}
function list(){const q=ui.q.trim().toLowerCase(),L=live(S.items);
 const its=L.filter(i=>(!ui.filter||i.status==ui.filter)&&(!q||(i.name+' '+i.brand+' '+i.cat).toLowerCase().includes(q)));
 if(!its.length){$('#list').innerHTML='<div class="empty">Nada por aquí ✨</div>';return}
 $('#list').innerHTML=cats(its).map(([c,arr])=>{const all=L.filter(i=>i.cat==c),cnt={};all.forEach(i=>cnt[i.status]=(cnt[i.status]||0)+1);const open=isOpen(c,q);
  return `<div class="grp ${open?'':'closed'}"><div class="gh" data-a="grp" data-v="${esc(c)}"><span class="e">${emo(c)}</span><span class="n">${esc(c)}</span><span class="c">${ui.filter?arr.length:`${cnt.Comprado||0}/${all.length}`}</span><span class="mini">${segBar(cnt,all.length)}</span><span class="chev">▾</span></div>
  <div class="items">${open?arr.sort((a,b)=>ORDER.indexOf(a.status)-ORDER.indexOf(b.status)||a.name.localeCompare(b.name,'es')).map(row).join(''):''}</div></div>`}).join('')}
function row(i){const on=i.status=='Comprado';
 return `<div class="it ${on?'done':''}" data-a="edit" data-v="${i.id}"><div class="ck ${on?'on':''}" data-a="check" data-v="${i.id}">${on?'✓':''}</div>
 <div class="t"><div title="${esc(i.name)}">${esc(i.name)}${i.qty?`<span class="qty">×${i.qty}</span>`:''}</div>${i.brand?`<small>${esc(i.brand)}</small>`:''}</div>
 <span class="pr">${i.price?eur(i.price):''}</span><span class="pill" style="background:${COL[i.status]}22;color:${COL[i.status]}">${i.status}</span></div>`}
function sheetHtml(){const i=ui.sheet,allC=[...new Set(live(S.items).map(x=>x.cat))].sort((a,b)=>a.localeCompare(b,'es'));
 return `<div class="ov" data-a="close"><div class="sh" data-a="none"><h3>${i._new?'Nuevo artículo':'Editar artículo'}</h3>
 <label>Artículo</label><input data-f="name" value="${esc(i.name)}" placeholder="Ej. Termómetro">
 <div class="row2"><div><label>Categoría</label><input data-f="cat" list="cl" value="${esc(i.cat)}"><datalist id="cl">${allC.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
 <div><label>Marca y modelo</label><input data-f="brand" value="${esc(i.brand)}"></div></div>
 <div class="row2"><div><label>Precio (€)</label><input data-f="price" type="number" step="0.01" inputmode="decimal" value="${i.price??''}"></div>
 <div><label>Cantidad</label><input data-f="qty" type="number" inputmode="numeric" value="${i.qty??''}"></div></div>

 <div class="acts">${i._new?'':`<button class="btn danger" data-a="del">Borrar</button>`}<button class="btn" data-a="savesheet">Guardar</button></div></div></div>`}
function menuHtml(){return `<div class="ov" data-a="close"><div class="sh menu" data-a="none"><h3>Ajustes</h3><div class="note">${$('#st')?$('#st').textContent:''}</div>
 ${fsOk()?'<button class="btn ghost" data-a="fs">⛶ Pantalla completa</button>':''}${standalone()?'':'<button class="btn rose" data-a="install">⬇ Instalar app</button>'}<button class="btn ghost" data-a="share">🔗 Compartir con la familia</button><button class="btn ghost" data-a="sync">🔄 Sincronizar ahora</button><button class="btn ghost" data-a="lock">🔒 Bloquear este dispositivo</button>

function mochila(){const M=live(S.bag),w=ui.who,its=M.filter(i=>w=='Todos'||i.who==w),done=M.filter(i=>i.done).length;
 $('#body').innerHTML=`<div class="secth"><div class="sect">🎒 Mochila del hospital <b>${done}/${M.length}</b></div><button class="btn" data-a="bagnew">+ Añadir</button></div>
 <div class="kpis">${kc({c:'#E8EFFA',n:`${done}<small>/${M.length}</small>`,l:'Todos',s:Math.round((M.length?done/M.length:0)*100)+'% listo',p:M.length?done/M.length:0,on:w=='Todos',a:'who',v:'Todos'})}${WHO.map(x=>{const a=M.filter(i=>i.who==x),d=a.filter(i=>i.done).length,p=a.length?d/a.length:0;return kc({c:WCOL[x],n:`${d}<small>/${a.length}</small>`,l:x,s:Math.round(p*100)+'% listo',p,on:w==x,a:'who',v:x})}).join('')}</div>
 
 <div class="cgrid one">${cats(its).map(([c,arr])=>{const k='m:'+c,open=isOpen(k,false),d=arr.filter(i=>i.done).length;return `<div class="grp ${open?'':'closed'}"><div class="gh" data-a="grp" data-v="${esc(k)}"><span class="e">${emo(c)}</span><span class="n">${esc(c)}</span><span class="c">${d}/${arr.length}</span><span class="mini"><i style="width:${d/arr.length*100}%;background:var(--rose)"></i></span><span class="chev">▾</span></div><div class="items">${open?arr.map(i=>`<div class="it ${i.done?'done':''}" data-a="bag" data-v="${i.id}"><div class="ck pk ${i.done?'on':''}">${i.done?'✓':''}</div><div class="t"><div>${esc(i.name)}</div><small style="color:${WCOL[i.who]||'var(--mu)'}">${i.who}</small></div><button class="x" data-a="bagdel" data-v="${i.id}" title="Quitar">×</button></div>`).join(''):''}</div></div>`}).join('')}</div>
 ${done?`<div style="text-align:center;margin-top:12px"><button class="btn ghost" data-a="bagreset">Desmarcar todo</button></div>`:''}`}
function bagSheet(){const cs=[...new Set(live(S.bag).map(i=>i.cat))].sort((a,b)=>a.localeCompare(b,'es'));
 const d=document.createElement('div');d.className='ov';d.dataset.a='closehelp';d.innerHTML=`<div class="sh"><h3>🎒 Añadir a la mochila</h3>
 <label>Qué</label><input id="bn" placeholder="Ej. Cargador del móvil">
 <div class="row2"><div><label>Para quién</label><select id="bw">${WHO.map(x=>`<option ${ui.who==x?'selected':''}>${x}</option>`).join('')}</select></div>
 <div><label>Categoría</label><input id="bc" list="bcl" placeholder="Extras"><datalist id="bcl">${cs.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div></div>
 <div class="acts"><button class="btn ghost" data-a="closehelp">Cancelar</button><button class="btn" id="bok">Añadir</button></div></div>`;document.body.appendChild(d);
 const ok=()=>{const n=d.querySelector('#bn').value.trim();if(!n)return;const w=d.querySelector('#bw').value,c=d.querySelector('#bc').value.trim()||(w=='Acompañante'?'Acompañante':'Extras');
  const i={id:'b'+Date.now().toString(36),cat:c,who:w,name:n,done:false};S.bag.push(i);persist(i);ui.open['m:'+c]=true;d.remove();mochila()};
 d.querySelector('#bok').onclick=ok;d.querySelector('#bn').onkeydown=e=>{if(e.key=='Enter')ok()};setTimeout(()=>d.querySelector('#bn').focus(),50)}

function resumen(){const st=stats(),pct=Math.round(st.by.Comprado.n/st.n*100)||0,M=live(S.bag),md=M.filter(i=>i.done).length,mp=M.length?md/M.length:0,inv=st.by.Comprado.eur+st.by.Pedido.eur;
  $('#body').innerHTML=`<div class="kpis">${kc({c:'#E8EFFA',n:st.n,l:'Todo',s:eur(Math.round(st.eur)),p:st.by.Comprado.n/st.n,on:false,a:'gofilter',v:''})}${ORDER.map(k=>kc({c:COL[k],n:st.by[k].n,l:k,s:st.by[k].eur?eur(Math.round(st.by[k].eur)):'—',p:st.by[k].n/st.n,on:false,a:'gofilter',v:k})).join('')}</div>
 <div class="bento">
  <div class="bt" data-a="tab" data-v="analisis" style="--c:var(--cy)"><span>💶 Invertido</span><b>${eurS(inv)}</b><small>comprado + pedido</small></div>
  <div class="bt" data-a="tab" data-v="mochila" style="--c:var(--rose)"><span>🎒 Mochila</span><b>${md}<small style="font-size:.55em;color:var(--mu)">/${M.length}</small></b><div class="btbar"><i style="width:${mp*100}%"></i></div></div>
 </div>
 <div class="card cv"><h3>🎯 ¿Cómo vamos?</h3><div class="cvw">${donut(ORDER.map(k=>({v:st.by[k].n,c:COL[k]})),pct+'%','comprado',desk()?190:150)}
  <div class="cvl">${ORDER.map(k=>`<div><i style="background:${COL[k]}"></i>${k}<b style="color:${COL[k]}">${Math.round(st.by[k].n/st.n*100)}%</b></div>`).join('')}
  </div></div></div>`}

function analisis(){const st=stats(),pct=Math.round(st.by.Comprado.n/st.n*100)||0,L=live(S.items),cs=cats(L);
 const sp=a=>a.filter(i=>i.status=='Comprado'||i.status=='Pedido').reduce((s,i)=>s+(+i.price||0),0);
 const money=cs.map(([c,a])=>[c,sp(a)]).sort((x,y)=>y[1]-x[1]),maxE=Math.max(1,...money.map(m=>m[1])),tot=st.by.Comprado.eur+st.by.Pedido.eur;
 const pend=cs.map(([c,a])=>{const v=a.filter(i=>i.status=='Visto'),n=a.filter(i=>i.status=='No visto');return [c,v.length,n.length,v.reduce((s,i)=>s+(+i.price||0),0)]}).filter(x=>x[1]+x[2]>0).sort((x,y)=>(y[1]+y[2])-(x[1]+x[2]));
 const maxP=Math.max(1,...pend.map(x=>x[1]+x[2])),rem=st.by.Visto.n+st.by['No visto'].n;
 $('#body').innerHTML=`<div class="sect">📈 Análisis</div><div class="rgrid">
 <div class="card"><h3>💶 Dinero</h3><div class="money"><b>${eur(Math.round(tot))}</b><span>Total invertido (comprado + pedido)</span></div>
 <div style="margin-top:14px">${money.map(([c,e])=>`<div class="crow" data-a="gocat" data-v="${esc(c)}" style="cursor:pointer"><span>${emo(c)} ${esc(c)}</span><div class="bar"><i style="width:${e/maxE*100}%;background:linear-gradient(90deg,var(--ok),var(--cy))"></i></div><span class="r" style="color:${e?'var(--tx)':'var(--mu)'}">${eur(Math.round(e))}</span></div>`).join('')}</div></div>
 <div class="card"><h3>🛍️ Lo que os queda</h3>
 <div class="note" style="margin:-6px 0 12px">Dónde está el trabajo pendiente. <b style="color:var(--am)">■ Visto</b> ya tiene candidato (${eur(Math.round(st.by.Visto.eur))}); <b style="color:var(--gr)">■ No visto</b> está sin mirar.</div>
 ${pend.map(([c,v,n,e])=>`<div class="crow" data-a="gocat" data-v="${esc(c)}" style="cursor:pointer"><span>${emo(c)} ${esc(c)}</span><div class="bar" style="background:transparent"><i style="width:${v/maxP*100}%;background:var(--am)"></i><i style="width:${n/maxP*100}%;background:var(--gr)"></i></div><span class="r">${v+n}</span></div>`).join('')}</div>
 <div class="card"><h3>📦 Por categoría</h3>${cs.map(([c,a])=>{const cnt={};a.forEach(i=>cnt[i.status]=(cnt[i.status]||0)+1);return `<div class="crow" data-a="gocat" data-v="${esc(c)}" style="cursor:pointer"><span>${emo(c)} ${esc(c)}</span><div class="bar">${segBar(cnt,a.length)}</div><span class="r">${cnt.Comprado||0}/${a.length}</span></div>`}).join('')}</div>
 </div>`}

/* ---------- acciones ---------- */
function closeSheet(save){const i=ui.sheet;if(save){i.name=(i.name||'').trim();if(i.name){i.cat=(i.cat||'').trim()||'Otros';delete i._new;const k=S.items.findIndex(x=>x.id==i.id);if(k<0)S.items.push(i);else S.items[k]=i;persist(i)}}ui.sheet=null;ui.del=false;render()}
async function share(){const url=location.origin+location.pathname;const txt='Lista de Jimena 🍼 '+url;
 try{if(navigator.share){await navigator.share({title:'Lista de Jimena',text:'Nuestra lista del bebé',url});return}}catch(e){if(e.name=='AbortError')return}
 try{await navigator.clipboard.writeText(txt);toast('Enlace copiado. Pásale también la contraseña.')}catch(e){toast(url)}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v;if(a=='none')return;if(a!='del')ui.del=false;
 const it=()=>S.items.find(x=>x.id==v),bg=()=>S.bag.find(x=>x.id==v);
 if(a=='tab'){ui.tab=v;ui.drawer=false;ui.filter=null;ui.who='Todos';ui.open={};ui.q='';history.replaceState(null,'','#'+v);render();scrollTo(0,0)}
 else if(a=='filter'){ui.filter=(!v||ui.filter==v)?null:v;ui.open={};compras()}
 else if(a=='grp'){ui.open[v]=!ui.open[v];ui.tab=='mochila'?mochila():list()}
 else if(a=='check'){e.stopPropagation();const i=it();if(i.status=='Comprado')i.status=i.prev||'No visto';else{i.prev=i.status;i.status='Comprado'}persist(i);render()}
 else if(a=='edit'){ui.sheet=JSON.parse(JSON.stringify(it()));render()}
 else if(a=='new'){ui.sheet={id:'c'+Date.now().toString(36),cat:'',name:ui.q||'',brand:'',price:null,qty:null,status:'No visto',_new:true};render()}
 else if(a=='close'){if(e.target==el){ui.sheet=null;ui.menu=false;render()}}
 else if(a=='st'){ui.sheet.status=v;document.querySelectorAll('.seg button').forEach(b=>{const k=b.dataset.v;b.style.cssText=k==v?`background:${COL[k]};color:#08142A;border-color:${COL[k]}`:''})}
 else if(a=='savesheet')closeSheet(true);
 else if(a=='del'){if(!ui.del){ui.del=true;el.textContent='¿Seguro? Toca otra vez';return}const i=S.items.find(x=>x.id==ui.sheet.id);i.del=true;persist(i);ui.sheet=null;ui.del=false;render()}
 else if(a=='gocat'){ui.tab='compras';ui.filter=null;ui.q='';ui.open={[v]:true};history.replaceState(null,'','#compras');render();scrollTo(0,0)}
 else if(a=='who'){ui.who=(ui.who==v&&el.classList.contains('kc')&&v!='Todos')?'Todos':v;ui.open={};mochila()}
 else if(a=='bag'){const i=bg();i.done=!i.done;persist(i);mochila()}
 else if(a=='bagdel'){e.stopPropagation();const i=bg();i.del=true;persist(i);mochila()}
 else if(a=='bagadd'){const n=$('#bn').value.trim();if(!n)return;const w=$('#bw').value,i={id:'b'+Date.now().toString(36),cat:w=='Acompañante'?'Acompañante':'Extras',who:w,name:n,done:false};S.bag.push(i);persist(i);mochila();setTimeout(()=>$('#bn')&&$('#bn').focus(),0)}
 else if(a=='bagreset'){if(el.dataset.c!='1'){el.dataset.c='1';el.textContent='¿Seguro? Toca otra vez';return}live(S.bag).forEach(i=>{if(i.done){i.done=false;i.u=Date.now()}});persist();mochila()}
 else if(a=='menu'){ui.menu=true;ui.drawer=false;render()}
 else if(a=='drawer'){ui.drawer=!ui.drawer;$('nav.tabs').classList.toggle('open',ui.drawer);$('.scrim').classList.toggle('open',ui.drawer)}
 else if(a=='fs'){const d=document,E=d.documentElement;try{if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);else (E.requestFullscreen||E.webkitRequestFullscreen).call(E)}catch(x){toast('Este navegador no deja pantalla completa')}if(ui.menu){ui.menu=false;render()}}
 else if(a=='share')share();
 else if(a=='bagnew')bagSheet();
 else if(a=='gofilter'){ui.tab='compras';ui.filter=v||null;ui.q='';render();scrollTo(0,0)}
 else if(a=='editpreg')pregSheet();
 else if(a=='install')doInstall();
 else if(a=='sync'){ui.menu=false;render();sync()}
 else if(a=='lock'){if(el.dataset.c!='1'){el.dataset.c='1';el.textContent='¿Seguro? Pedirá la contraseña';return}lock()}
});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='q'){ui.q=t.value;list()}else if(t.dataset.f&&ui.sheet){const f=t.dataset.f;ui.sheet[f]=(f=='price'||f=='qty')?(t.value===''?null:+t.value):t.value}});
document.addEventListener('change',e=>{if(e.target.id=='due'&&e.target.value){S.due=e.target.value;S.dueU=Date.now();persist();render()}});
document.addEventListener('focusout',()=>setTimeout(()=>{if(deferRender&&!ui.sheet&&!(document.activeElement&&['INPUT','SELECT'].includes(document.activeElement.tagName)))safeRender()},50));
document.addEventListener('keydown',e=>{const tg=e.target.tagName;
 if(e.key=='Enter'&&e.target.id=='bn')$('[data-a=bagadd]').click();
 else if(e.key=='Enter'&&ui.sheet&&tg=='INPUT')closeSheet(true);
 else if(e.key=='Escape'&&(ui.sheet||ui.menu||ui.drawer)){ui.sheet=null;ui.menu=false;ui.drawer=false;render()}
 else if(e.key=='/'&&tg!='INPUT'&&view=='app'){if(ui.tab!='compras'){ui.tab='compras';render()}e.preventDefault();$('#q')&&$('#q').focus()}});
let lastDesk=desk();addEventListener('resize',()=>{if(desk()!=lastDesk){lastDesk=desk();safeRender()}});

/* ---------- instalar ---------- */
let bip=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;
function installBtn(){return standalone()?'':`<button class="inst" data-a="install">⬇<em> Instalar</em></button>`}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();bip=e;document.querySelectorAll('.inst').forEach(b=>b.classList.add('ready'))});
addEventListener('appinstalled',()=>{bip=null;toast('¡Instalada! Búscala en tu pantalla de inicio 🎉');safeRender()});
async function doInstall(){ui.menu=false;
 if(bip){try{bip.prompt();const r=await bip.userChoice;if(r.outcome==='accepted'){bip=null;toast('Instalando…')}}catch(e){showHelp()}return}
 showHelp()}
function showHelp(){const ios=/iphone|ipad/i.test(navigator.userAgent),inapp=/wv\)|FBAN|FBAV|Instagram|WhatsApp/i.test(navigator.userAgent);
 const d=document.createElement('div');d.className='ov';d.dataset.a='closehelp';d.innerHTML=`<div class="sh"><h3>⬇ Instalar Lista de Jimena</h3>
 ${inapp?'<div class="note" style="color:var(--am);font-weight:800">Estás dentro de otra app. Abre este enlace en Chrome primero.</div>':''}
 ${ios?`<div class="note" style="font-size:14px">1. Ábrela en <b>Safari</b>.<br>2. Pulsa <b>Compartir</b> (el cuadrado con flecha).<br>3. Elige <b>«Añadir a pantalla de inicio»</b>.</div>`
 :`<div class="note" style="font-size:14px">Chrome todavía no ofrece instalarla en este móvil. Prueba:<br>1. Pulsa <b>⋮</b> arriba a la derecha.<br>2. Elige <b>«Añadir a pantalla de inicio»</b> → <b>Crear acceso directo</b> o <b>Instalar</b>.<br><br>Si sale «No se ha podido abrir la aplicación», en Ajustes → Aplicaciones → Chrome → Permisos, activa <b>«Accesos directos en pantalla de inicio»</b>.</div>`}
 <div class="acts"><button class="btn" data-a="closehelp">Entendido</button></div></div>`;document.body.appendChild(d)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a=closehelp]');if(el&&(e.target===el||el.tagName=='BUTTON'))document.querySelectorAll('.ov').forEach(o=>{if(o.dataset.a=='closehelp')o.remove()})});

function pregSheet(){const due=new Date((S.due||'2027-02-23')+'T12:00:00'),days=Math.ceil((due-new Date())/864e5),ga=Math.max(0,280-days);
 const d=document.createElement('div');d.className='ov';d.dataset.a='closehelp';d.innerHTML=`<div class="sh"><h3>🤰 ¿De cuánto está?</h3>
 <div class="row2"><div><label>Semanas</label><input id="pw_w" type="number" min="0" max="42" inputmode="numeric" value="${Math.floor(ga/7)}"></div><div><label>Días</label><input id="pw_d" type="number" min="0" max="6" inputmode="numeric" value="${ga%7}"></div></div>
 <label>…o fecha prevista de parto</label><input id="pw_due" type="date" value="${S.due||''}">
 <div class="note">Al cambiar semanas y días se recalcula la fecha prevista, y al revés.</div>
 <div class="acts"><button class="btn ghost" data-a="closehelp">Cancelar</button><button class="btn" id="pw_ok">Guardar</button></div></div>`;document.body.appendChild(d);
 const W=d.querySelector('#pw_w'),D=d.querySelector('#pw_d'),F=d.querySelector('#pw_due');
 const fromWD=()=>{const g=Math.max(0,(+W.value||0)*7+Math.min(6,+D.value||0)),t=new Date();t.setHours(12,0,0,0);t.setDate(t.getDate()+280-g);F.value=t.toISOString().slice(0,10)};
 const fromF=()=>{if(!F.value)return;const g=Math.max(0,280-Math.ceil((new Date(F.value+'T12:00:00')-new Date())/864e5));W.value=Math.floor(g/7);D.value=g%7};
 W.oninput=fromWD;D.oninput=fromWD;F.oninput=fromF;
 d.querySelector('#pw_ok').onclick=()=>{if(F.value){S.due=F.value;S.dueU=Date.now();persist()}d.remove();render()}}
/* ---------- arranque ---------- */
const t0=Date.now();
async function boot(){if(token&&S){view='app';render();sync()}else if(token){try{await enter(token)}catch(e){await gate('unlock')}}else await gate('unlock');
 setTimeout(()=>$('#splash').classList.add('out'),Math.max(0,2600-(Date.now()-t0)))}
boot();
if('serviceWorker' in navigator&&location.protocol=='https:')navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});
</script></body></html>
