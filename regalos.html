<!DOCTYPE html>
<html lang="es"><head>
<meta name="referrer" content="no-referrer"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lista de regalos para Jimena 🎁</title>
<meta name="description" content="Ideas de regalo para Jimena. ¡Gracias por pensar en ella!">
<meta property="og:title" content="Lista de regalos para Jimena 🎁">
<meta property="og:description" content="Ideas de regalo para Jimena. ¡Gracias por pensar en ella!">
<meta property="og:image" content="https://pietor12-spec.github.io/lista-jimena/icon-j-512.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#FFF0F6">
<link rel="icon" href="icon-j-32.png"><link rel="apple-touch-icon" href="icon-j-180.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--tx:#3D4B6E;--mu:#8C98B3;--rose:#FF6FA0;--ok:#2EC4A0;--cy:#4AB3E6;--line:#F2DCE6}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--tx);background:linear-gradient(180deg,#FFF0F6 0%,#EEF7FF 55%,#EFFAF5 100%) fixed;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 18px 40px}
header{text-align:center;margin-bottom:22px}
header img{width:92px;height:92px;border-radius:24px;box-shadow:0 12px 34px rgba(255,111,160,.28);animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
h1{margin:14px 0 6px;font-size:30px;font-weight:900;line-height:1.15}h1 span{color:var(--rose)}
header p{margin:0 auto;max-width:460px;color:var(--mu);font-weight:700;font-size:15px;line-height:1.5}
.count{display:inline-block;margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 16px;font-weight:800;font-size:14px;box-shadow:0 4px 14px rgba(255,111,160,.1)}
.count b{color:var(--rose)}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:360px){.cr{width:118px}.card{height:196px}}
.card{min-width:0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px 14px 14px 18px;box-shadow:0 6px 20px rgba(255,111,160,.08);display:flex;gap:12px;position:relative;overflow:hidden;animation:fade .5s both;height:214px}
.cl{flex:1;min-width:0;display:flex;flex-direction:column}
.ct b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:17px;font-weight:900;line-height:1.25}
.ct small,.ct em{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm{flex:1;display:flex;align-items:center;justify-content:center}
.cr{flex:none;width:136px;display:flex;flex-direction:column;gap:8px}
.go{display:block;text-align:center;padding:10px 4px;font-size:13px;white-space:nowrap}
.tag{display:block;text-align:center;white-space:nowrap;padding:10px 4px!important}.tag.off{background:#F3F5FA;color:var(--mu)}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--rose),#FFB3CC)}
.card b{font-size:17px;font-weight:900}.card small{display:block;color:var(--mu);font-weight:700;font-size:13px;margin-top:2px}
.card em{display:block;font-style:normal;font-size:13px;color:var(--cy);font-weight:700;margin-top:6px}
.price{font-weight:900;font-size:28px;letter-spacing:-.3px}
.ph{position:relative;aspect-ratio:1;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center}.ph img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;padding:6px;background:#fff}.ph span{position:absolute;font-size:40px;opacity:.3}
.go{background:var(--rose);color:#fff;text-decoration:none;font-weight:900;font-size:14px;padding:10px 14px;border-radius:12px;white-space:nowrap}
.go:active{transform:scale(.97)}
.card.got{opacity:.62}.card.got:before{background:var(--ok)}.card.got b{text-decoration:line-through;text-decoration-color:rgba(46,196,160,.7)}
.tag{background:#E3F8EF;color:#1E9C7E;font-weight:900;font-size:13px;padding:8px 12px;border-radius:12px}
.tip{margin:24px auto 0;max-width:520px;text-align:center;background:#fff;border:1px dashed #F6BCD1;border-radius:16px;padding:14px 16px;font-weight:700;font-size:14px;color:var(--tx)}
.empty,.load{text-align:center;color:var(--mu);font-weight:700;padding:40px 10px}
@keyframes pop{from{transform:scale(.5);opacity:0}}@keyframes fade{from{opacity:0;transform:translateY(8px)}}
html{scrollbar-width:none}html::-webkit-scrollbar{display:none}.wrap{overflow-x:clip}
.ov{position:fixed;inset:0;background:rgba(70,80,110,.35);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:fade .2s}
@media(min-width:620px){.ov{align-items:center}.sh{border-radius:22px}}
.sh b{font-size:18px;font-weight:900}.sh p{margin:4px 0 12px;color:var(--mu);font-weight:700;font-size:14px}
.sh a{display:flex;align-items:center;gap:12px;padding:13px 14px;margin-bottom:8px;border-radius:14px;border:1px solid var(--line);background:#FFF6F9;text-decoration:none;color:var(--tx);font-weight:900}
.sh a i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;font-size:13px}.sh a span{flex:1}
.sh button{width:100%;margin-top:4px;padding:12px;border:0;border-radius:14px;background:#EEF6FC;color:var(--tx);font:inherit;font-weight:800}
button.go{border:0;font-family:inherit;cursor:pointer;width:100%}
</style></head><body><div class="wrap">
<header><img src="logo-j.svg" alt=""><h1>Lista de regalos para <span>Jimena</span> 🎁</h1>
<p>¡Gracias por pensar en ella! 💕 Estas son algunas cosas que nos vendrían genial. Toca «Ver en la tienda» para ver el producto.</p>
<div class="count" id="count">Cargando…</div></header>
<div id="list" class="load">Cargando la lista…</div>
<div class="tip">💡 Antes de comprar algo, avisa a los papás para que no se repita 😉</div>
</div>
<script>
const SRC=['https://api.github.com/repos/pietor12-spec/lista-jimena/contents/wishlist.json','wishlist.json'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>(+n).toLocaleString('es-ES',{maximumFractionDigits:2,useGrouping:'always'})+' €';
const RAW='https://raw.githubusercontent.com/pietor12-spec/lista-jimena/main/';const im=s=>!s?'':/^https?:/i.test(s)?ok(s):RAW+s;
const links=i=>[...new Set((i.urls&&i.urls.length?i.urls:[i.url]).map(x=>ok(x||'')).filter(Boolean))].slice(0,3);
const host=u=>{try{const p=new URL(u).hostname.replace(/^www\./,'').split('.');const n=p.length>1?p[p.length-2]:p[0];return n.charAt(0).toUpperCase()+n.slice(1)}catch(e){return 'Tienda'}};
function pick(k){const i=window._it[k],U=links(i);const d=document.createElement('div');d.className='ov';d.onclick=e=>{if(e.target===d)d.remove()};
 d.innerHTML=`<div class="sh"><b>${esc(i.name)}</b><p>Elige la tienda que prefieras</p>${U.map((u,n)=>`<a href="${esc(u)}" target="_blank" rel="noopener"><i>${n+1}</i><span>${esc(host(u))}</span>↗</a>`).join('')}<button onclick="this.closest('.ov').remove()">Cerrar</button></div>`;document.body.appendChild(d)}
const ok=u=>{try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:''}catch(e){return ''}};
async function load(){for(const s of SRC){try{const r=await fetch(s+(s.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});if(!r.ok)continue;const j=await r.json();
 if(j.content){const b=Uint8Array.from(atob(j.content.replace(/\s/g,'')),c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(b))}return j}catch(e){}}return null}
load().then(d=>{const L=document.getElementById('list'),C=document.getElementById('count');
 const it=(d&&d.items||[]).slice().sort((a,b)=>(a.got?1:0)-(b.got?1:0)||a.name.localeCompare(b.name,'es'));
 const pend=it.filter(i=>!i.got).length;
 if(!it.length){C.textContent='Lista vacía por ahora';L.className='empty';L.textContent='Todavía no hay nada en la lista. ¡Vuelve pronto! 🍼';return}
 C.innerHTML=`<b>${pend}</b> ${pend==1?'idea disponible':'ideas disponibles'}${it.length-pend?` · ${it.length-pend} ya regalada${it.length-pend>1?'s':''}`:''}`;
 L.className='grid';window._it=it;L.innerHTML=it.map((i,k)=>{const U=links(i),u=U[0],p=im(i.img);return `<div class="card ${i.got?'got':''}" style="animation-delay:${k*40}ms">
 <div class="cl"><div class="ct"><b>${esc(i.name)}</b>${i.brand?`<small>${esc(i.brand)}</small>`:''}${i.note?`<em>${esc(i.note)}</em>`:''}</div>
 <div class="cm">${i.price?`<span class="price">≈ ${eur(i.price)}</span>`:''}</div></div>
 <div class="cr"><div class="ph">${p?`<img src="${esc(p)}" alt="" loading="lazy" onerror="this.remove()">`:''}<span>🎁</span></div>${i.got?'<span class="tag">🎁 ¡Ya regalado!</span>':U.length>1?`<button class="go" onclick="pick(${k})">Ver ${U.length} tiendas ↗</button>`:u?`<a class="go" href="${esc(u)}" target="_blank" rel="noopener">Ver en tienda ↗</a>`:'<span class="tag off">Sin enlace</span>'}</div></div>`}).join('')});
</script></body></html>
